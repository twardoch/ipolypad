[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "ipolypad"
dynamic = ["version"]
description = "Convert an image or SVG into a padded polygon hull for CSS shape-outside / text-wrap."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Adam Twardoch", email = "adam+github@twardoch.com" }]
keywords = ["svg", "polygon", "shape-outside", "text-wrap", "potrace", "image-processing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
  "fire>=0.6",
  "resvg-py>=0.1.5",
  "potracer>=0.0.4",
  "pillow>=10.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.22",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ipolypad = "ipolypad.__main__:main"

[project.urls]
Homepage = "https://github.com/twardoch/ipolypad"
Documentation = "https://code.twardoch.com/ipolypad/"
Repository = "https://github.com/twardoch/ipolypad"
Issues = "https://github.com/twardoch/ipolypad/issues"

[tool.hatch.version]
source = "vcs"
raw-options = { root = ".." }

[tool.hatch.build.hooks.vcs]
version-file = "src/ipolypad/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ipolypad"]

[tool.hatch.build.targets.sdist]
include = ["src/ipolypad", "README.md", "../LICENSE", "../SPEC.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
